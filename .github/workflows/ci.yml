name: CI Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & Verify Backend
        run: |
          cd server
          npm install
          node -e "console.log('Server dependencies OK')"

      - name: Install & Build Frontend
        run: |
          cd client
          npm install
          npm run build

